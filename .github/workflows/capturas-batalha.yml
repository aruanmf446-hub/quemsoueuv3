name: Capturas temporárias da batalha
on:
  push:
    branches: [claude/capturas-batalha]
permissions:
  contents: write
concurrency:
  group: capturas-batalha
  cancel-in-progress: true
jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.7.2 e display virtual
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot/engine.zip"
          unzip -q "$RUNNER_TEMP/godot/engine.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Smoke e capturas
        run: |
          set +e -uo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          OUT="$GITHUB_WORKSPACE/capturas-batalha"
          rm -rf "$OUT"; mkdir -p "$OUT"
          python3 tools/godot/run_smoke.py --godot "$GODOT" --output "$RUNNER_TEMP/smoke" > "$OUT/smoke.txt" 2>&1
          cp "$RUNNER_TEMP/smoke/battle_presentation.log" "$OUT/" 2>/dev/null
          for res in 1920x1080 844x390 640x360; do
            export XDG_DATA_HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)"
            timeout 600 xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT" --path . --rendering-method gl_compatibility --audio-driver Dummy \
              --script res://tests/battle_reference/flow.gd -- "$res" "$OUT/$res" > "$OUT/captura-$res.log" 2>&1
            echo "exit=$?" >> "$OUT/captura-$res.log"
          done
      - name: Gravar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A capturas-batalha
          git commit -m "Capturas reais da batalha" || exit 0
          git push origin HEAD:claude/capturas-batalha
