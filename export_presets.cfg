; Preparados estaticamente; validar no Godot 4.7.2 antes de gerar builds.
[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="docs/*,tools/*,supabase/*,build/*,tests/*,evidence/*,assets/references/*,*.obj,*.mtl,*.mp3,assets/characters/El fuego/Correr.fbx,assets/characters/Lorena/1.fbx"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
html/custom_html_shell="res://web/shell.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true

[preset.1]
name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="docs/*,tools/*,supabase/*,build/*"
export_path="build/android/quemsoueu.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
package/unique_name="com.quemsoueu.v3"
permissions/internet=true
