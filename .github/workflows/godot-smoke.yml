name: Godot real headless smoke
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/testes-godot-08, work/integracao-tarefas-04-08, chatgpt/t18a-cinematic-login]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Design aprovado dos menus (sem molduras reprovadas)
        run: python3 tools/player_ui/check_design.py
      - name: Download exact official engine (no fallback)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot/engine.zip"
          unzip "$RUNNER_TEMP/godot/engine.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --version | grep -E '^4[.]7[.]2[.]stable[.]official'
      - name: Import and open actual scenes
        run: python3 tools/godot/run_smoke.py --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --output "$RUNNER_TEMP/results"
      - name: T17 invite state and local battle regression
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/t17_web_invites/flow_test.gd
          "$GODOT" --headless --path . --script res://tests/duel_local/flow_test.gd
      - name: T18 auth and session regression (without real users)
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/t18_auth/flow_test.gd
      - name: Capture actual auth UI at 3 landscape resolutions
        shell: bash
        env:
          T18_CAPTURE_DIR: ${{ runner.temp }}/t18-auth-captures
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$T18_CAPTURE_DIR"
          xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --path . --script res://tests/t18_auth/capture.gd
          test -s "$T18_CAPTURE_DIR/auth_1920x1080.png"
          test -s "$T18_CAPTURE_DIR/auth_844x390.png"
          test -s "$T18_CAPTURE_DIR/auth_640x360.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t18-auth-real-interface-screenshots
          path: ${{ runner.temp }}/t18-auth-captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-headless-results
          path: ${{ runner.temp }}/results
