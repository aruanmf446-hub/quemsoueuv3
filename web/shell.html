<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
const boot = document.getElementById('boot');
const fill = document.getElementById('fill');
const status = document.getElementById('status');
function mb(bytes){return (bytes/1048576).toFixed(1)+' MB';}
function fail(message){status.textContent = 'Não foi possível abrir o jogo: ' + message;}
const missing = Engine.getMissingFeatures({threads: GODOT_THREADS_ENABLED});
if (missing.length) {
	fail('navegador sem ' + missing.join(', '));
} else {
	engine.startGame({
		onProgress: function(current, total) {
			if (total > 0) {
				const share = Math.min(current/total, 1);
				fill.style.width = (share*100).toFixed(1) + '%';
				status.textContent = 'Baixando o jogo… ' + Math.round(share*100) + '%  (' + mb(current) + ' de ' + mb(total) + ')';
				if (share >= 1) status.textContent = 'Abrindo a cidade do deserto…';
			} else {
				status.textContent = 'Baixando o jogo… ' + mb(current);
			}
		},
	}).then(function() {
		boot.classList.add('done');
		setTimeout(function(){boot.remove();}, 500);
	}, function(error){ fail(error && error.message ? error.message : String(error)); });
}
</script>
