name: Godot real headless smoke
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/testes-godot-08, work/integracao-tarefas-04-08, chatgpt/t18a-cinematic-login, work/fix-login-progress-before-main, work/startup-profile-music-fix, work/nickname-onboarding-chat-503]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Design aprovado dos menus (sem molduras reprovadas)
        run: python3 tools/player_ui/check_design.py
      - name: Download exact official engine (no fallback)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot/engine.zip"
          unzip "$RUNNER_TEMP/godot/engine.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --version | grep -E '^4[.]7[.]2[.]stable[.]official'
      - name: Import and open actual scenes
        run: python3 tools/godot/run_smoke.py --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --output "$RUNNER_TEMP/results"
      - name: T32 voice lifecycle regression (offline)
        run: |
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script res://tests/voice/flow_test.gd
      - name: Live content editor regression (offline)
        run: |
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script res://tests/editor_content/verify.gd
      - name: T28 official rewards UI regression (headless, offline)
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/rewards_t28/flow_test.gd
      - name: T30 premium news and gifts UI regression
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/rewards_t30/flow_test.gd
      - name: T30 real Godot render captures at approved resolutions
        env:
          T30_CAPTURE_DIR: ${{ runner.temp }}/news-t30
        run: |
          mkdir -p "$T30_CAPTURE_DIR"
          xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --path . --script res://tests/rewards_t30/capture.gd
          for file in home_1920x1080 decks_1672x941 skins_1280x720 android_844x390 android_640x360 received_1920x1080 error_1920x1080 loading_1280x720; do
            test -s "$T30_CAPTURE_DIR/$file.png"
          done
      - name: T30 screenshots artifact (real renderer, fixture only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-t30-godot-real-screens
          path: ${{ runner.temp }}/news-t30/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: T31 full-art battle layout and real Godot captures
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/battle-t31"
          xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --path . --script res://tests/battle_t31/layout_test.gd -- "$RUNNER_TEMP/battle-t31"
          for resolution in 1920x1080 1280x720 844x390 640x360; do
            test -s "$RUNNER_TEMP/battle-t31/${resolution}_20cards.png"
          done
      - name: T31 battle screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-t31-expanded-cards
          path: ${{ runner.temp }}/battle-t31/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: T17 invite state and local battle regression
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/t17_web_invites/flow_test.gd
          "$GODOT" --headless --path . --script res://tests/duel_local/flow_test.gd
      - name: T18 auth and session regression (without real users)
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/t18_auth/flow_test.gd
      - name: Regression persistence / login buttons
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/persistence/flow_test.gd
      - name: Validate restored startup, profile logout and music playback
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/ui_session_music/flow_test.gd
      - name: First nickname UI and profile guards
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/nickname_onboarding/flow_test.gd
      - name: T21 preferences per owner, deck drafts, favorites and card framing
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/preferences_t21/flow_test.gd
          "$GODOT" --headless --path . --script res://tests/decks_t21/flow_test.gd
          "$GODOT" --headless --path . --script res://tests/decks_t21/sync_test.gd
          "$GODOT" --headless --path . --script res://tests/decks/library_flow.gd
          "$GODOT" --headless --path . --script res://tests/decks_t23/flow_test.gd
          "$GODOT" --headless --path . --script res://tests/decks_t24/flow_test.gd
          "$GODOT" --headless --path . --script res://tests/library_t24/flow_test.gd
          "$GODOT" --headless --path . --script res://tests/library_t24/sync_cover_test.gd
          "$GODOT" --headless --path . --script res://tests/duel_t25/browse_test.gd
          "$GODOT" --headless --path . --script res://tests/duel_t26/form_test.gd
          "$GODOT" --headless --path . --script res://tests/community_t27/flow_test.gd
          "$GODOT" --headless --path . --script res://tests/ios_t24/duel_ios_test.gd
          "$GODOT" --headless --path . --script res://tests/web_text/bridge_test.gd
          "$GODOT" --headless --path . --script res://tests/battle_reveal/flow.gd
          "$GODOT" --headless --path . --script res://tests/settings_t22/flow_test.gd
          "$GODOT" --headless --path . --script res://tests/friends_t22/flow_test.gd
      - name: Verify authentication appears before lobby (T18A startup)
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/t18a_startup/flow_test.gd
      - name: Capture actual auth UI at 3 landscape resolutions
        shell: bash
        env:
          T18_CAPTURE_DIR: ${{ runner.temp }}/t18-auth-captures
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$T18_CAPTURE_DIR"
          xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --path . --script res://tests/t18_auth/capture.gd
          test -s "$T18_CAPTURE_DIR/auth_1920x1080.png"
          test -s "$T18_CAPTURE_DIR/auth_844x390.png"
          test -s "$T18_CAPTURE_DIR/auth_640x360.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t18-auth-real-interface-screenshots
          path: ${{ runner.temp }}/t18-auth-captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-headless-results
          path: ${{ runner.temp }}/results
