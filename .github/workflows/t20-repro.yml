name: T20 reprodução Web (temporário)
on:
  push:
    branches: [claude/t20-repro]
permissions:
  contents: write
concurrency:
  group: t20
  cancel-in-progress: true
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.7.2 e templates Web
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/xdg-data/godot/export_templates/4.7.2.stable"
          curl -fsSL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot/engine.zip"
          curl -fsSL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/engine.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          for name in version.txt web_nothreads_debug.zip web_nothreads_release.zip; do unzip -p "$RUNNER_TEMP/godot/templates.tpz" "templates/$name" > "$RUNNER_TEMP/xdg-data/godot/export_templates/4.7.2.stable/$name"; done
      - name: Exportar release e debug
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: |
          set +e
          E="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" build/rel build/dbg
          "$E" --headless --editor --import --quit > /dev/null 2>&1
          "$E" --headless --export-release Web build/rel/index.html > /dev/null 2>&1
          "$E" --headless --export-debug Web build/dbg/index.html > /dev/null 2>&1
          for d in rel dbg; do mkdir -p build/$d/music build/$d/loading; (cd assets/music && find . -name '*.mp3' -exec cp --parents {} ../../build/$d/music/ \;); echo '[]' > build/$d/loading/list.json; done
          ls -la build/rel build/dbg | head -30
          python3 - <<'PY'
          import re
          for d in ['rel','dbg']:
              b=open(f'build/{d}/index.wasm','rb').read()
              print(d,'size',len(b),'has name section',b'\x04name' in b)
          PY
      - name: Playwright
        run: |
          npm init -y > /dev/null; npm install playwright@1.48.2 > /dev/null; npx playwright install --with-deps chromium > /dev/null
      - name: Reproduzir na tela de músicas
        run: |
          set +e
          OUT=evidence/t20/music; mkdir -p $OUT
          (cd build/dbg && python3 -m http.server 8801 > /dev/null 2>&1 &)
          (cd build/rel && python3 -m http.server 8802 > /dev/null 2>&1 &)
          sleep 2
          node tests/web_t20/music_crash.cjs http://127.0.0.1:8801/ $OUT/debug-844 844x390 420 | tee $OUT/debug-844.log
          node tests/web_t20/music_crash.cjs http://127.0.0.1:8802/ $OUT/release-844 844x390 420 | tee $OUT/release-844.log
          node tests/web_t20/music_crash.cjs https://aruanmf446-hub.github.io/quemsoueuv3/ $OUT/prod-844 844x390 300 | tee $OUT/prod-844.log
      - name: Gravar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence/t20
          git commit -m "T20: reprodução da tela de músicas" || exit 0
          git push origin HEAD:claude/t20-repro
