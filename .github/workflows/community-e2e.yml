name: Comunidade E2E (contas de teste)

on:
  push:
    branches: [work/deck-runtime-corrections]
    paths:
      - '.github/workflows/community-e2e.yml'
      - 'tools/e2e/community_access.py'
  workflow_dispatch:
    inputs:
      stage:
        description: "access (login/consultas) | publish | community | finish | cleanup"
        required: true
        default: access
      upload_order:
        description: "files_first (como o jogo) | cards_first"
        required: false
        default: files_first
      deck_id:
        description: "DECK_ID (community/finish)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Etapa ${{ inputs.stage }}
        env:
          QSE_TEST_OWNER_EMAIL: ${{ secrets.QSE_TEST_OWNER_EMAIL }}
          QSE_TEST_OWNER_PASSWORD: ${{ secrets.QSE_TEST_OWNER_PASSWORD }}
          QSE_TEST_READER_EMAIL: ${{ secrets.QSE_TEST_READER_EMAIL }}
          QSE_TEST_READER_PASSWORD: ${{ secrets.QSE_TEST_READER_PASSWORD }}
          QSE_TEST_R1_EMAIL: ${{ secrets.QSE_TEST_R1_EMAIL }}
          QSE_TEST_R1_PASSWORD: ${{ secrets.QSE_TEST_R1_PASSWORD }}
          STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'access' }}
          DECK_ID: ${{ inputs.deck_id }}
          UPLOAD_ORDER: ${{ inputs.upload_order }}
        run: |
          if [ "$STAGE" = access ]; then
            python3 tools/e2e/community_access.py
          else
            python3 tools/e2e/community_e2e.py "$STAGE" "$DECK_ID"
          fi
