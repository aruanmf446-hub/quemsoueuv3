name: Capturas temporárias do PR 26
# Temporário: fotografa Personagens e Configurações na main e no PR #26 com o Godot real
# e grava as imagens neste mesmo branch (claude/capturas-pr26). Apagar o branch depois.
on:
  push:
    branches: [claude/capturas-pr26]
permissions:
  contents: write
concurrency:
  group: capturas-pr26
  cancel-in-progress: true
jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Godot 4.7.2 oficial e display virtual
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot/engine.zip"
          unzip -q "$RUNNER_TEMP/godot/engine.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Fotografar main e PR
        run: |
          set -uo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          OUT="$GITHUB_WORKSPACE/capturas-pr26"
          mkdir -p "$OUT"
          git worktree add "$RUNNER_TEMP/main" origin/main
          cp tools/godot/capture_skins_pr26.gd "$RUNNER_TEMP/main/tools/godot/"
          for pair in "pr:$GITHUB_WORKSPACE" "main:$RUNNER_TEMP/main"; do
            name="${pair%%:*}"; dir="${pair#*:}"
            export XDG_DATA_HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)"
            "$GODOT" --headless --path "$dir" --editor --import --quit > "$OUT/$name-import.log" 2>&1 || true
            for res in 1920x1080 844x390; do
              xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT" --path "$dir" --rendering-method gl_compatibility --audio-driver Dummy \
                --script res://tools/godot/capture_skins_pr26.gd -- "$OUT/$name-personagens-$res" "$res" > "$OUT/$name-personagens-$res.log" 2>&1 || true
              xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT" --path "$dir" --rendering-method gl_compatibility --audio-driver Dummy \
                --script res://tools/godot/capture_settings.gd -- "$OUT/$name-configuracoes-$res" "$res" > "$OUT/$name-configuracoes-$res.log" 2>&1 || true
            done
          done
          ls -la "$OUT"
      - name: Gravar capturas neste branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capturas-pr26
          git commit -m "Capturas reais de Personagens e Configurações (main x PR 26)" || exit 0
          git push origin HEAD:claude/capturas-pr26
