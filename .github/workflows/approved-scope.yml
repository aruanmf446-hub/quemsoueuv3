name: Approved scope guard
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-scope:
    name: Approved scope guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify approved areas against trusted base
        env:
          QSE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          QSE_APPROVED_CHANGE: ${{ vars.QSE_APPROVED_CHANGE }}
        shell: bash
        run: |
          set -euo pipefail
          base="${QSE_BASE_SHA:-$(git rev-parse HEAD^)}"
          guard="$RUNNER_TEMP/qse-approved-guard.py"
          if git cat-file -e "$base:tools/governance/check_approved.py" 2>/dev/null; then
            git show "$base:tools/governance/check_approved.py" > "$guard"
          else
            cp tools/governance/check_approved.py "$guard"
          fi
          python3 "$guard" --base "$base"
